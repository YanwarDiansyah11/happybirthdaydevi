<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ucapan untuk Devi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Great Vibes', cursive;
      background-color: #e0d0b0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      height: 75vh;
      background: url('kartu ucapan estetik kosong vintage coklat.png') no-repeat center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 50px;
    }

    .text {
      font-size: 1.5rem;
      color: #4b3b2a;
      line-height: 1.8;
      white-space: pre-line;
    }

    .nav-container {
      margin-top: 20px;
      display: flex;
      gap: 20px;
    }

    .nav {
      font-size: 2rem;
      background-color: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 10px 25px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 12px;
      transition: background-color 0.2s ease;
    }

    .nav:hover {
      background-color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

<div class="container">
  <div id="slide" class="text"></div>
</div>

<div class="nav-container">
  <button class="nav" onclick="prevSlide()">←</button>
  <button class="nav" onclick="nextSlide()">→</button>
</div>

<script>
  const slides = [
    "Bissmillah\nAssalamualaikum Devii..\nini adalah ucapan mas yang kedua. Kalau yang pertama tadi sebetulnya sudah lama mas buat, yaaa mungkin semenjak mas kenal Devi mas mulai iseng deh bikin bikin kayak gitu hehe.",
    "Dan hari ini tiba waktunya mas kasih ini ke Devii,\nsemoga Devi suka ya hadiah dari mas.\n\nSemangat terus yaa, mas sangat bahagia ketika liat Devi bahagia, dan semoga Devi bahagia terus yaa dengan Dika.",
    "Jangan menyerah memperjuangkan cinta kalian yaa,\nmas ngerti cinta Devi ke Dika sangat tuluus banget. Dan itu dibuktikan ketika Devi pingin banget merubah Dika menjadi pria yang baik, tidak merokok, lebih peduliin Devi dan selalu menomorsatukan Devi.",
    "Itu sangat wajar kok. Mas sangat kagum dengan perjuangan Devi. Dan semoga apa yang diharapkan Devi yaitu Dika menjadi pria yang baik lagi, Allah kabulkan yaa.",
    "Oh iya, mas juga berterima kasih ya,\nkarena sudah hadir di bagian cerita mas.\nMas sekarang mulai mengerti bahwa mencintai seseorang bukan berarti harus memiliki.\n\nTapi dengan melihat Devi bahagia dengan yang lain pun sangat cukup buat mas saat ini. Tapi ketika Devi sedih, mas juga ikut sedih.",
    "Gak papa kalau capek.\nBisa cerita terus kok sama mas.\nMas siap untuk menerima ocehan keluh kesahnya Devi...",
    "Dan doain mas ya agar bisa bertemu dengan jodoh yang pas buat mas nantinya hehe.",
    "Terus semangat belajarnya, ngajinya, ibadahnya.\nDan satu lagi: jangan malu yaa ketika keluar usahain pakai hijabnya.\nMasa iya seorang gadis cantik dengan mudahnya orang menikmati? Sayang doong. Hehe.",
    "Sekali lagi selamat ulang tahun yang ke-16 tahun ya..\nPerjalanan Devi masih panjang, kejar terus cita-cita Devi dan selalu buat bangga ayah dan ibu Devi.\n\nAssalamualaikum warahmatullahi wabarakatuh"
  ];

  let currentSlide = 0;

  function showSlide(index) {
    const slide = document.getElementById('slide');
    slide.textContent = slides[index];
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      showSlide(currentSlide);
    }
  }

  function nextSlide() {
    if (currentSlide < slides.length - 1) {
      currentSlide++;
      showSlide(currentSlide);
    }
  }

  showSlide(currentSlide);
</script>

</body>
</html>
